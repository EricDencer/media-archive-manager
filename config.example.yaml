application:
  environment: production

media_locations:
  - name: primary-archive
    enabled: true
    path: "/home/user/Media Archive"
    media_types:
      - dvd
      - bluray

paths:
  archive_root: "/home/user/Media Archive"
  staging_root: "/home/user/Media Archive/staging"
  encoded_root: "/home/user/Media Archive/encoded"
  database_path: "/home/user/Media Archive/media_archive.db"
  schema_path: "schema.sql"

capabilities:
  acquisition:
  enabled: false

  optical_devices:
    - name: primary-drive
      enabled: true
      device: "/dev/sr0"

publishing:
    enabled: false

  ai:
    enabled: false